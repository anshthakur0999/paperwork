name: Publish Paperwork homepage
on:
  push:
    branches: [main]
    paths: ["homepage/**", "scripts/build_homepage.py", "static/tools.json", "static/index.html", "static/styles.css", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6.0.0
      - run: python scripts/build_homepage.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output/github-pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
