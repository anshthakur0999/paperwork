services:
  - type: web
    name: paperwork-pdf
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PAPERWORK_MODE
        value: hosted
      - key: PAPERWORK_MAX_UPLOAD_MB
        value: "25"
      - key: PAPERWORK_MAX_OUTPUT_MB
        value: "64"
      - key: PAPERWORK_SOURCE_URL
        value: https://github.com/anshthakur0999/paperwork
